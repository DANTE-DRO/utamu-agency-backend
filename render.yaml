services:
  - type: web
    name: utamu-agency-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: utamu2025
      - key: DATA_DIR
        value: /var/data
    disk:
      name: utamu-data
      mountPath: /var/data
      sizeGB: 1
